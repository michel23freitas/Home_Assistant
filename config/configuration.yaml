
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template:
  - sensor:
      - name: "S23 Michel Sleep Duration Hours"
        unique_id: s23_michel_sleep_duration_hours
        unit_of_measurement: "h"
        device_class: duration
        state: "{{ (states('sensor.s23_michel_sleep_duration') | float(0) / 60) | round(2) }}"

switch:
  - platform: template
    switches:
      computador:
        friendly_name: "Computador"
        value_template: "{{ is_state_attr('media_player.echo_quarto', 'source', 'DESKTOP-6QCLLTO') }}"
        turn_on:
          action: button.press
          target:
            entity_id: button.wake_on_lan_c8_7f_54_63_36_c2
        turn_off:
          action: switch.turn_on
          target:
            entity_id: switch.shell_desligar_computador